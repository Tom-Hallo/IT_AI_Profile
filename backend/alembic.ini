# Alembic configuration (Database Engineer, D1).
# Run every `alembic ...` command from the backend/ directory
# (or `docker compose exec backend alembic ...`).
# Full guide and troubleshooting: migrations/README.md
#
# IMPORTANT: keep this file ASCII-only (no accented characters, even in comments).
# Alembic reads it with the operating system's default encoding, which is cp1252 on
# Windows, and non-ASCII characters make every `alembic` command crash there.

[alembic]
script_location = migrations

# Migration file name pattern (Blueprint section 2): YYYYMMDD_HHMM_<rev>_<slug>
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# Add the current directory (backend/) to sys.path so `import app...` works.
prepend_sys_path = .
path_separator = os

# DELIBERATELY NO `sqlalchemy.url` HERE.
# The connection URL comes from app.core.config.settings (DATABASE_URL) via
# migrations/env.py, so Backend, Worker and Alembic share one configuration and
# no password is ever stored in this file.

# After a new revision is created, run ruff (a dev dependency) on it so the file
# passes the CI lint: removes unused imports, sorts imports, formats.
# Requires `pip install ".[dev]"`.
[post_write_hooks]
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
