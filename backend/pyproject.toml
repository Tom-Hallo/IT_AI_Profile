[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "it-ai-profile-backend"
version = "0.1.0"
description = "IT Talent AI Profile - Backend (FastAPI) và Worker (RQ), PBI-001"
requires-python = ">=3.12"
# Phiên bản ghim chính xác (Blueprint mục 8.2): mỗi bản đã phát hành >= 14 ngày tính đến 06/11/2026.
# rq ghim dòng 2.x theo Blueprint (rq 3.0.0 mới ra 28/10/2026, chưa nằm trong phạm vi đã duyệt).
dependencies = [
    "fastapi==0.161.1",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "redis==8.1.0",
    "rq==2.12.0",
    "httpx==0.28.1",
    "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88


[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "sqlalchemy"]
