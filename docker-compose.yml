name: it-talent-ai-profile

services:

  # ========================================
  # 1. POSTGRESQL
  # ========================================
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  # ========================================
  # 2. REDIS
  # ========================================
  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  # ========================================
  # 3. BACKEND - FASTAPI
  # ========================================
  backend:
    build:
      context: ./backend

    working_dir: /app

    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      WORKER_QUEUES: ${WORKER_QUEUES:-default}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/auth/github/callback}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:?GITHUB_TOKEN_ENCRYPTION_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 10s
      timeout: 7s
      retries: 10
      start_period: 15s

    restart: unless-stopped

  # ========================================
  # 4. WORKER - RQ
  # ========================================
  worker:
    build:
      context: ./backend

    working_dir: /app

    command:
      - python
      - -m
      - app.workers.worker

    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      WORKER_QUEUES: ${WORKER_QUEUES:-default}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:?GITHUB_TOKEN_ENCRYPTION_KEY is required}

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  # ========================================
  # 5. FRONTEND - REACT + VITE
  # ========================================
  frontend:
    build:
      context: ./frontend

    working_dir: /app

    command:
      - npm
      - run
      - dev
      - --
      - --host
      - "0.0.0.0"
      - --port
      - "5173"

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      BACKEND_INTERNAL_URL: http://backend:8000
      FRONTEND_WATCH_POLLING: ${FRONTEND_WATCH_POLLING:-true}

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:5173/
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules: