<section class="analysis-job" id="analysis-job">
  <h2>Repository analysis</h2>
  <p data-status role="status" aria-live="polite">Loading...</p>
  <progress data-progress max="100" value="0" aria-label="Analysis progress"></progress>
  <p data-error role="alert"></p>
  <button data-cancel type="button">Cancel</button>
  <button data-retry type="button" hidden>Retry</button>
</section>
