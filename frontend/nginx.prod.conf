# Only the host's trusted Caddy proxy (or a local smoke test) reaches this port.
map $http_x_forwarded_proto $ita_scheme {
    default $scheme;
    https https;
    http http;
}
# Avoid OAuth code/state and other query parameters in access logs.
log_format ita_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log ita_safe;
    # Nginx error messages can contain original URLs; omit routine errors.
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        # Resolve service again after backend container replacement.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $ita_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
